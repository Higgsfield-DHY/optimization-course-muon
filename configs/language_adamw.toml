[run]
name = "language_adamw"
task = "language"
seed = 0
device = "cuda"

[optimizer]
name = "adamw"
lr = 0.0003
weight_decay = 0.01
betas = [0.9, 0.95]

[language]
data_dir = "data/shakespeare_byte"
n_layer = 6
n_head = 4
n_embd = 256
block_size = 128
batch_size = 8
grad_accum = 4
max_steps = 1000
warmup_steps = 100
