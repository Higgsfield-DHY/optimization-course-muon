[run]
name = "language_tuning_ns5_b8"
task = "language"
seed = 101
device = "cuda"
output_root = "runs/course_v1/language"
phase = "tuning"
cohort = "course_v1"

[optimizer]
name = "muon"
lr = 0.05
weight_decay = 0.01
betas = [0.9, 0.95]
eps = 1e-08
momentum = 0.95
nesterov = true
ns_steps = 5
ns_eps = 1e-07
method = "ns"
aspect_scale = true
aux_lr = 0.0003
normalization = "max"

[language]
n_layer = 6
n_head = 4
n_embd = 256
block_size = 128
dropout = 0.1
batch_size = 8
grad_accum = 4
max_steps = 300
eval_every = 100
eval_batches = 10
log_every = 10
checkpoint_every = 100
warmup_steps = 30
min_lr_ratio = 0.1
clip_grad = 1.0
data_dir = "data/shakespeare_byte"
eval_mode = "full"
