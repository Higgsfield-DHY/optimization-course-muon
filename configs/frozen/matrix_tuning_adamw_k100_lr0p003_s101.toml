[run]
name = "matrix_tuning_adamw_k100"
task = "matrix"
seed = 101
device = "cpu"
output_root = "runs/course_v1/matrix"
phase = "tuning"
cohort = "course_v1"

[optimizer]
name = "adamw"
lr = 0.003
weight_decay = 0.0
betas = [0.9, 0.95]
eps = 1e-08
momentum = 0.95
nesterov = true
ns_steps = 5
ns_eps = 1e-07
method = "ns"
aspect_scale = false
aux_lr = 0.0003
normalization = "max"

[matrix]
rows = 32
cols = 16
condition_number = 100.0
noise_std = 0.0
steps = 300
log_every = 10
checkpoint_every = 100
